# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/opt/homebrew/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.

default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: auth
  username: postgres
  password: deus
  host: 127.0.0.1
  port: 5432

test:
  <<: *default
  database: auth
  username: postgres
  password: deus
  host: 127.0.0.1
  port: 5432

production:
  primary: &primary_production
    <<: *default
    database: auth_production
    username: auth
    password: <%= ENV["AUTH_DATABASE_PASSWORD"] %>
    host: 127.0.0.1
    port: 5432
  cache:
    <<: *primary_production
    database: auth_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: auth_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: auth_production_cable
    migrations_paths: db/cable_migrate
